<!-- The container the spec calls "your personal page": 720px on desktop,
     390px on mobile. Geometry lives in css/projects.css. -->
<main class="proj-page">

  <h1 class="proj-title">My Project</h1>
  <p class="proj-sub">
    Six reserved blocks. The first one is playable &mdash; the rest open their details.
  </p>

  <!-- live filter, wired in js/projects.js -->
  <div class="filter-bar">
    <input class="filter-input" id="filterInput" type="search"
           placeholder="Filter by keyword&#8230;" aria-label="Filter projects by keyword">
    <button class="tag-btn active" type="button" data-tag="all">all</button>
    <button class="tag-btn" type="button" data-tag="web">web</button>
    <button class="tag-btn" type="button" data-tag="ai">ai</button>
    <button class="tag-btn" type="button" data-tag="data">data</button>
    <p class="filter-count" id="filterCount"></p>
  </div>

  <!-- the six blocks are created by js/projects.js from one data array -->
  <div class="block-grid" id="blockGrid"></div>

</main>
